<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Automation Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 32px;
    }
    a.report-link {
      display: block;
      margin: 12px 0;
      padding: 12px 32px;
      background: #0078d4;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 1.2em;
      transition: background 0.2s;
    }
    a.report-link:hover {
      background: #005fa3;
    }
    .note {
      margin-top: 40px;
      font-size: 0.95em;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Test Automation Reports</h1>
  <a href="./allure-report/" class="report-link" target="_blank">View Allure Report</a>
  <a href="./extent-results/" class="report-link" target="_blank">View Extent Report</a>
  <div class="note">
    Reports are generated by automated CI/CD pipelines.<br/>
    If you don't see the latest results, they may still be processing.
  </div>
</body>
</html>
